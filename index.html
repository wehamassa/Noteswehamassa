<style id="lockcss">
html,body{margin:0;height:100%;background:#0b1a2e;color:#f4e9d8;font-family:"SF Arabic","Noto Sans Arabic","Geeza Pro",Tahoma,system-ui,sans-serif;overflow:hidden}
#lock{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 120%,#1f6f8b 0,#0b1a2e 55%,#050b1c 100%)}
#lock .st{position:absolute;inset:0;background-image:radial-gradient(1px 1px at 20% 30%,#fff,transparent),radial-gradient(1px 1px at 70% 20%,#fff,transparent),radial-gradient(1.5px 1.5px at 40% 70%,#fff8,transparent),radial-gradient(1px 1px at 85% 60%,#fff,transparent),radial-gradient(1px 1px at 10% 80%,#fffa,transparent),radial-gradient(1.5px 1.5px at 55% 40%,#fff,transparent);background-size:300px 300px;opacity:.7}

#lock .sea{position:absolute;bottom:0;left:-10%;right:-10%;height:22%;background:repeating-linear-gradient(170deg,#0e3d55 0 14px,#124a66 14px 22px);opacity:.85;animation:w 9s linear infinite;border-radius:50% 50% 0 0/20px 20px 0 0}
@keyframes w{to{background-position:220px 0}}
#lock form{position:relative;width:min(84vw,320px);text-align:center}
#lock .lg{width:78px;height:78px;margin:0 auto 18px;border-radius:50%;border:2px solid #d9b46a;position:relative;animation:o 12s linear infinite}

#lock .lg::before{background:#e8826b;right:4px}#lock .lg::after{background:#3f8fc4;left:4px}
@keyframes o{to{transform:rotate(360deg)}}
#lock h1{font-size:26px;margin:0 0 22px;letter-spacing:1px}
#lock input{width:100%;box-sizing:border-box;background:#0b1a2ecc;border:1px solid #d9b46a88;color:#f4e9d8;border-radius:14px;padding:14px;font-size:18px;text-align:center;outline:none}
#lock input:focus{border-color:#d9b46a}
#lock button{margin-top:12px;width:100%;background:#d9b46a;color:#0b1a2e;border:0;border-radius:14px;padding:14px;font-size:16px;font-weight:700;font-family:inherit}
#lock .err{min-height:24px;margin-top:10px;color:#e8826b;font-size:14px}

<script>
(function(){
  var SRC='<!doctype html>\n'+document.documentElement.outerHTML;
  var B=JSON.parse(document.getElementById('blob').textContent),fails=0,until=0,E=new TextEncoder();
  function ub(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)});}
  async function op(key,b){return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:b.slice(0,12)},key,b.slice(12)));}
  async function pk(code,salt){var m=await crypto.subtle.importKey('raw',E.encode(code),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:B.it,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['decrypt']);}
  var err=document.getElementById('err'),inp=document.getElementById('code'),btn=document.getElementById('go');
  if(!window.crypto||!crypto.subtle){err.textContent='افتح الرابط من متصفح حديث عبر https';btn.disabled=true;}
  document.getElementById('lf').addEventListener('submit',async function(e){
    e.preventDefault();var code=inp.value.trim();if(!code)return;
    if(Date.now()<until){err.textContent='انتظر قليلًا ثم حاول';return;}
    btn.disabled=true;btn.textContent='…';err.textContent='';
    var hit=null;
    for(var i=0;i<B.w.length;i++){try{var w=B.w[i];var r=await op(await pk(code,ub(w.s)),ub(w.c));hit=JSON.parse(new TextDecoder().decode(r));break;}catch(x){}}
    if(!hit){fails++;if(fails>=5){until=Date.now()+30000*Math.pow(2,fails-5);}err.textContent='الرمز غير صحيح';btn.disabled=false;btn.textContent='دخول';inp.value='';return;}
    var hk=ub(hit.k),key=await crypto.subtle.importKey('raw',hk,'AES-GCM',false,['decrypt']);
    var payload=new TextDecoder().decode(await op(key,ub(B.p)));var P=JSON.parse(payload);
    window.__MADAR={who:hit.w,hk:hk,code:code,payload:payload,loaderSrc:SRC,cfg:P.cfg};window.SIG=P.sig;
    var st=document.createElement('style');st.textContent=P.css;document.head.appendChild(st);
    document.getElementById('lock').remove();document.getElementById('lockcss').remove();
    document.body.insertAdjacentHTML('afterbegin',P.html);
    var sc=document.createElement('script');sc.textContent=P.js;document.body.appendChild(sc);
  });
})();
